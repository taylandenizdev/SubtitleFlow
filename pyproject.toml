[project]
name = "subtitle-flow"
version = "0.1.0"
description = "Hazır ses için kaynak dilli STT ve Türkçe MT ortak temeli"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Taylan Deniz Topçu" }]
keywords = ["stt", "translation", "turkish", "youtube"]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
api = [
    "httpx>=0.27,<1",
]
cli = [
    "typer>=0.12,<1",
    "python-dotenv>=1.0,<2",
]
desktop = [
    "pywebview>=6,<7",
]

[project.scripts]
subtitle-flow = "subtitle_flow.cli_entry:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_flow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/.python-version",
    "/.env.example",
]
